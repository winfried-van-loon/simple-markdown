<!DOCTYPE html>
<html class="bg-gray-50 dark:bg-gray-900 dark:text-gray-100">
<head>
  <meta charset="UTF-8">
  <title>MD Editor</title>
  <!-- TailwindCSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class'
    }
  </script>
</head>
<body class="flex h-screen font-sans">
  <!-- Sidebar -->
  <div id="sidebar" class="w-64 p-4 bg-gray-200 dark:bg-gray-800 border-r border-gray-300 dark:border-gray-700 space-y-4">
    <div class="space-y-2">
      <button id="newPage" class="w-full px-3 py-2 bg-blue-500 text-white rounded hover:bg-blue-600">Nieuwe pagina</button>
      <button id="uploadPagesBtn" class="w-full px-3 py-2 bg-green-500 text-white rounded hover:bg-green-600">Upload pagina(s)</button>
      <!-- Verborgen file input -->
      <input type="file" id="uploadPagesInput" multiple class="hidden" accept=".md">
      <button id="downloadAll" class="w-full px-3 py-2 bg-purple-500 text-white rounded hover:bg-purple-600">Download Alle Pagina’s</button>
    </div>
    <div class="space-y-1">
      <label for="filterSelect" class="block text-sm font-medium">Filter op categorie:</label>
      <select id="filterSelect" class="w-full p-2 border border-gray-300 rounded bg-white dark:bg-gray-700 dark:border-gray-600">
        <option value="Alle">Alle</option>
      </select>
    </div>
    <div class="space-y-1">
      <label for="searchInput" class="block text-sm font-medium">Zoeken:</label>
      <input type="text" id="searchInput" placeholder="Zoek op titel..." class="w-full p-2 border border-gray-300 rounded bg-white dark:bg-gray-700 dark:border-gray-600">
    </div>
    <ul id="pageList" class="space-y-2"></ul>
  </div>

  <!-- Main content -->
  <div id="main" class="flex-1 p-6 space-y-4">
    <!-- Toolbar -->
    <div id="toolbar" class="flex flex-wrap items-center gap-3">
      <button id="editMode" class="px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600">Bewerken</button>
      <button id="previewMode" class="px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600">Voorbeeld</button>
      <button id="download" class="px-4 py-2 bg-indigo-500 text-white rounded hover:bg-indigo-600">Download Pagina</button>
      <button id="toggleDark" class="px-4 py-2 bg-gray-500 text-white rounded hover:bg-gray-600">Dark Mode</button>
      <div class="flex items-center gap-2">
        <label for="categoryInput" class="text-sm font-medium">Categorie:</label>
        <input type="text" id="categoryInput" placeholder="Categorie" class="p-2 border border-gray-300 rounded bg-white dark:bg-gray-700 dark:border-gray-600">
      </div>
    </div>
    <!-- Editor container -->
    <div id="editorContainer" class="flex-1 border border-gray-300 dark:border-gray-700 rounded overflow-hidden">
      <textarea id="editor" class="w-full h-full" placeholder="Schrijf hier je markdown..."></textarea>
    </div>
    <!-- Preview container -->
    <div id="preview" class="flex-1 border border-gray-300 dark:border-gray-700 rounded p-4 overflow-auto hidden"></div>
  </div>

  <!-- Externe bibliotheken -->
  <!-- marked.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
  <!-- highlight.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
  <!-- CodeMirror -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.7/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.7/mode/markdown/markdown.min.js"></script>
  <!-- JSZip -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.0/jszip.min.js"></script>

  <script>
    // Globale variabele voor huidige view: "edit" of "preview"
    let currentView = "edit";

    // Toggle dark mode
    document.getElementById('toggleDark').addEventListener('click', function() {
      document.documentElement.classList.toggle('dark');
    });

    // Preprocess Markdown: vervang [[pageName]] door een link
    function preprocessMarkdown(mdText) {
      return mdText.replace(/\[\[(.*?)\]\]/g, function(match, p1) {
        const pageName = p1.trim();
        return `<a href="#" class="md-link text-blue-500 dark:text-blue-300 underline" data-page="${pageName}">${pageName}</a>`;
      });
    }

    // Voeg klikhandlers toe aan de gegenereerde markdown links
    function attachMdLinkHandlers() {
      const links = document.querySelectorAll('.md-link');
      links.forEach(link => {
        link.addEventListener('click', function(e) {
          e.preventDefault();
          const pageName = this.getAttribute('data-page');
          // Zoek de pagina met deze titel (case-insensitive)
          const target = pages.find(p => p.title.toLowerCase() === pageName.toLowerCase());
          if (target) {
            saveCurrentPage();
            currentPageId = target.id;
            cmEditor.setValue(target.content);
            categoryInput.value = target.category;
            updatePageList();
            updateView();
          }
        });
      });
    }

    // Configureer marked met highlight.js
    marked.setOptions({
      highlight: function(code, lang) {
        if (lang && hljs.getLanguage(lang)) {
          return hljs.highlight(code, {language: lang}).value;
        }
        return hljs.highlightAuto(code).value;
      }
    });

    // Data-opslag: array van pagina-objecten
    let pages = JSON.parse(localStorage.getItem('pages')) || [];
    let currentPageId = null;

    // DOM-elementen
    const pageList = document.getElementById('pageList');
    const filterSelect = document.getElementById('filterSelect');
    const searchInput = document.getElementById('searchInput');
    const categoryInput = document.getElementById('categoryInput');
    const previewDiv = document.getElementById('preview');
    const editorContainer = document.getElementById('editorContainer');

    // Maak CodeMirror aan
    let cmEditor = CodeMirror.fromTextArea(document.getElementById('editor'), {
      mode: "markdown",
      lineNumbers: true,
      lineWrapping: true
    });

    // Sla pagina's op in localStorage
    function savePages() {
      localStorage.setItem('pages', JSON.stringify(pages));
    }

    // Slaat huidige pagina op
    function saveCurrentPage() {
      if (!currentPageId) {
        let defaultTitle = "Naamloos";
        let counter = 1;
        while (pages.find(p => p.title === defaultTitle)) {
          defaultTitle = "Naamloos" + counter;
          counter++;
        }
        const newPage = {
          id: Date.now() + Math.random(),
          title: defaultTitle,
          content: cmEditor.getValue(),
          category: categoryInput.value || ""
        };
        pages.push(newPage);
        currentPageId = newPage.id;
      } else {
        const page = pages.find(p => p.id === currentPageId);
        if (page) {
          page.content = cmEditor.getValue();
          page.category = categoryInput.value;
        }
      }
      savePages();
    }

    // Update de weergave (bewerken of voorbeeld)
    function updateView(){
      if(currentView === "preview"){
        saveCurrentPage();
        const rawContent = cmEditor.getValue();
        const processedContent = preprocessMarkdown(rawContent);
        previewDiv.innerHTML = marked.parse(processedContent);
        previewDiv.classList.remove('hidden');
        editorContainer.classList.add('hidden');
        hljs.highlightAll();
        attachMdLinkHandlers();
      } else {
        previewDiv.classList.add('hidden');
        editorContainer.classList.remove('hidden');
        cmEditor.refresh();
      }
    }

    // Update de sidebar (pagina lijst)
    function updatePageList() {
      const currentFilter = filterSelect.value || "Alle";
      const searchQuery = searchInput.value.toLowerCase();
      let categories = new Set();
      pages.forEach(page => {
        let cat = page.category.trim() || "Ongecategoriseerd";
        categories.add(cat);
      });
      // Werk de filteropties bij
      filterSelect.innerHTML = "";
      const allOpt = document.createElement("option");
      allOpt.value = "Alle";
      allOpt.textContent = "Alle";
      filterSelect.appendChild(allOpt);
      categories.forEach(cat => {
        const opt = document.createElement("option");
        opt.value = cat;
        opt.textContent = cat;
        filterSelect.appendChild(opt);
      });
      filterSelect.value = currentFilter;

      // Werk de lijst bij
      pageList.innerHTML = "";
      pages.forEach((page, index) => {
        let pageCat = page.category.trim() || "Ongecategoriseerd";
        if (currentFilter !== "Alle" && pageCat !== currentFilter) return;
        if (searchQuery && !page.title.toLowerCase().includes(searchQuery)) return;

        const li = document.createElement("li");
        li.className = "p-2 border-b border-gray-300 dark:border-gray-700 rounded hover:bg-gray-100 dark:hover:bg-gray-700";
        if (page.id === currentPageId) {
          li.classList.add("bg-gray-300", "dark:bg-gray-700", "font-bold");
        }

        // Titel + (optioneel) categorie
        const showCategory = (currentFilter === "Alle");
        const titleDiv = document.createElement("div");
        titleDiv.className = "page-title text-lg cursor-pointer";
        titleDiv.innerHTML = showCategory ? `${page.title} (<em class="italic font-normal">${pageCat}</em>)` : page.title;
        titleDiv.addEventListener('click', () => {
          saveCurrentPage();
          currentPageId = page.id;
          cmEditor.setValue(page.content);
          categoryInput.value = page.category;
          updatePageList();
          updateView();
        });
        li.appendChild(titleDiv);

        // Actieknoppen op een nieuwe regel
        const actionsDiv = document.createElement("div");
        actionsDiv.className = "action-buttons-row mt-1";
        
        // Hernoemen (✏️)
        const renameBtn = document.createElement("button");
        renameBtn.innerHTML = "✏️";
        renameBtn.title = "Hernoemen";
        renameBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          let newTitle = prompt("Nieuwe titel:", page.title);
          if (newTitle) {
            page.title = newTitle;
            savePages();
            updatePageList();
          }
        });
        actionsDiv.appendChild(renameBtn);
        
        // Verwijderen (🗑️)
        const deleteBtn = document.createElement("button");
        deleteBtn.innerHTML = "🗑️";
        deleteBtn.title = "Verwijderen";
        deleteBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          if (confirm("Weet je zeker dat je deze pagina wilt verwijderen?")) {
            pages.splice(index, 1);
            if (currentPageId === page.id) {
              if (pages.length > 0) {
                currentPageId = pages[0].id;
                cmEditor.setValue(pages[0].content);
                categoryInput.value = pages[0].category;
              } else {
                currentPageId = null;
                cmEditor.setValue("");
                categoryInput.value = "";
              }
            }
            savePages();
            updatePageList();
            updateView();
          }
        });
        actionsDiv.appendChild(deleteBtn);
        
        // Omhoog (🔼)
        const upBtn = document.createElement("button");
        upBtn.innerHTML = "🔼";
        upBtn.title = "Omhoog";
        upBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          if (index > 0) {
            [pages[index], pages[index - 1]] = [pages[index - 1], pages[index]];
            savePages();
            updatePageList();
          }
        });
        if(index === 0) upBtn.style.visibility = 'hidden';
        actionsDiv.appendChild(upBtn);
        
        // Omlaag (🔽)
        const downBtn = document.createElement("button");
        downBtn.innerHTML = "🔽";
        downBtn.title = "Omlaag";
        downBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          if (index < pages.length - 1) {
            [pages[index], pages[index + 1]] = [pages[index + 1], pages[index]];
            savePages();
            updatePageList();
          }
        });
        if(index === pages.length - 1) downBtn.style.visibility = 'hidden';
        actionsDiv.appendChild(downBtn);

        li.appendChild(actionsDiv);
        pageList.appendChild(li);
      });
    }

    // Eventlisteners voor filtering en zoeken
    filterSelect.addEventListener('change', updatePageList);
    searchInput.addEventListener('input', updatePageList);

    // Nieuwe pagina aanmaken
    document.getElementById('newPage').addEventListener('click', () => {
      saveCurrentPage();
      let title = prompt("Geef de titel van de nieuwe pagina op:");
      if (title) {
        if (pages.find(p => p.title === title)) {
          alert("Een pagina met deze titel bestaat al!");
        } else {
          const newPage = {
            id: Date.now() + Math.random(),
            title: title,
            content: "",
            category: ""
          };
          pages.push(newPage);
          currentPageId = newPage.id;
          cmEditor.setValue("");
          categoryInput.value = "";
          updatePageList();
          savePages();
          updateView();
        }
      }
    });

    // Upload pagina's
    document.getElementById('uploadPagesBtn').addEventListener('click', () => {
      document.getElementById('uploadPagesInput').click();
    });
    document.getElementById('uploadPagesInput').addEventListener('change', (event) => {
      const files = event.target.files;
      if (!files.length) return;
      Array.from(files).forEach(file => {
        const reader = new FileReader();
        reader.onload = function(e) {
          let content = e.target.result;
          let title = file.name.replace(/\.md$/i, '');
          let originalTitle = title;
          let counter = 1;
          while (pages.find(p => p.title === title)) {
            title = originalTitle + "_" + counter;
            counter++;
          }
          const newPage = {
            id: Date.now() + Math.random(),
            title: title,
            content: content,
            category: ""
          };
          pages.push(newPage);
          if (!currentPageId) {
            currentPageId = newPage.id;
            cmEditor.setValue(newPage.content);
            categoryInput.value = newPage.category;
          }
          savePages();
          updatePageList();
        };
        reader.readAsText(file);
      });
      event.target.value = "";
    });

    // Wisselen tussen bewerken en voorbeeld
    document.getElementById('editMode').addEventListener('click', () => {
      currentView = "edit";
      updateView();
    });
    document.getElementById('previewMode').addEventListener('click', () => {
      currentView = "preview";
      updateView();
    });

    // Download huidige pagina
    document.getElementById('download').addEventListener('click', () => {
      saveCurrentPage();
      const page = pages.find(p => p.id === currentPageId);
      if (page) {
        const blob = new Blob([page.content], { type: 'text/markdown' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = page.title + '.md';
        a.click();
        URL.revokeObjectURL(url);
      }
    });

    // Download alle pagina's als ZIP
    document.getElementById('downloadAll').addEventListener('click', () => {
      saveCurrentPage();
      const zip = new JSZip();
      pages.forEach(page => {
        const fileName = page.title + ".md";
        const cat = page.category.trim();
        if (cat) {
          let folder = zip.folder(cat);
          folder.file(fileName, page.content);
        } else {
          zip.file(fileName, page.content);
        }
      });
      zip.generateAsync({ type: "blob" }).then(function(content) {
        const url = URL.createObjectURL(content);
        const a = document.createElement("a");
        a.href = url;
        a.download = "pagina's.zip";
        a.click();
        URL.revokeObjectURL(url);
      });
    });

    // Automatisch opslaan tijdens typen in CodeMirror
    cmEditor.on('change', () => {
      saveCurrentPage();
    });

    // Initialisatie: laad de eerste pagina of maak een standaardpagina aan
    if (pages.length > 0) {
      currentPageId = pages[0].id;
      cmEditor.setValue(pages[0].content);
      categoryInput.value = pages[0].category;
    } else {
      currentPageId = Date.now() + Math.random();
      const defaultPage = {
        id: currentPageId,
        title: "Naamloos",
        content: "",
        category: ""
      };
      pages.push(defaultPage);
      savePages();
    }
    updatePageList();
    updateView();
  </script>
</body>
</html>
